name: Native desktop packages
on:
  workflow_dispatch:
  # Pushing a tag like v0.4.4 builds everything and publishes a GitHub Release with the installers.
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Build dependencies
        run: dnf install -y --setopt=retries=5 --disablerepo=fedora-cisco-openh264 git gcc-c++ cmake ninja-build qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtshadertools-devel qt6-qtwebengine-devel qt6-qtwebchannel-devel libsecret rpm-build
      - uses: actions/checkout@v4
      - run: cmake --preset release && cmake --build --preset release --parallel 2
      - run: cpack --config build/CPackConfig.cmake -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: mira-linux-rpm
          path: dist/*.rpm
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: win64_msvc2022_64
            label: windows
          - os: macos-14
            arch: clang_64
            label: macos
    runs-on: ${{ matrix.os }}
    env:
      QT_VERSION: 6.8.3
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.arch }}
          modules: qtshadertools qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          'PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VSINSTALLDIR','WindowsSdkDir' | ForEach-Object {
            $value = [Environment]::GetEnvironmentVariable($_)
            if ($value) { "$_=$value" >> $env:GITHUB_ENV }
          }
          choco install nsis ninja -y --no-progress
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH
      - name: Build
        shell: bash
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
          # Qt's deploy step needs an absolute prefix; on Windows convert Git Bash's /d/... path to D:/...
          stage="$PWD/stage"
          if command -v cygpath >/dev/null; then stage="$(cygpath -m "$stage")"; fi
          cmake --install build --prefix "$stage"
      - name: Sign Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./packaging/sign-windows.ps1 -Path stage/bin/mira.exe
      - name: Sign and notarize macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/sign-macos.sh
      - name: Package staged application
        shell: bash
        run: |
          stage="$PWD/stage"
          if command -v cygpath >/dev/null; then stage="$(cygpath -m "$stage")"; fi
          cpack --config build/CPackConfig.cmake -D CPACK_INSTALL_CMAKE_PROJECTS= -D "CPACK_INSTALLED_DIRECTORIES=$stage;/" -B dist
      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: Get-ChildItem dist/*.exe | ForEach-Object { ./packaging/sign-windows.ps1 -Path $_.FullName }
      - name: Notarize DMG and archive app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MACOS_SIGN_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            for dmg in dist/*.dmg; do
              xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$dmg"
            done
          fi
          ditto -c -k --keepParent stage/mira.app dist/mira-app.zip
      - name: Qt notices and Mira source
        shell: bash
        run: |
          if [[ -d "$QT_ROOT_DIR/licenses" ]]; then
            tar -czf "dist/qt-binary-notices-${{ matrix.label }}.tar.gz" -C "$QT_ROOT_DIR" licenses
          fi
          git archive --format=tar.gz --output=dist/mira-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mira-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      # The corresponding Qt source (LGPL) is about 1 GB and the same for every platform,
      # so it is fetched once and kept apart from the small app downloads.
      - name: Corresponding Qt sources
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p qt-src
          curl --fail --location --retry 3 "https://download.qt.io/archive/qt/6.8/${QT_VERSION}/single/qt-everywhere-src-${QT_VERSION}.tar.xz" -o "qt-src/qt-everywhere-src-${QT_VERSION}.tar.xz"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: qt-sources
          path: qt-src/*.tar.xz
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.8.3
      # Qt 6.8 is built and tested with NDK r26b.
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android builds need a desktop Qt of the same version for host tools (moc, qsb, androiddeployqt),
      # including Shader Tools for the M3Shapes shaders. Installed first so QT_ROOT_DIR ends up on Android.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true
      # No host: for Qt >= 6.7 the action picks "all_os", where Qt publishes its Android packages.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools
          cache: true
      - name: Android NDK and Ninja
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null
      - name: Build APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          cmake --build build-android --parallel 4
          cmake --build build-android --target apk
          # Catch a broken manifest template before anyone installs the APK.
          manifest=$(find build-android -path '*android-build*' -name AndroidManifest.xml | head -1)
          grep -q 'android:value="mira"' "$manifest" || { echo "Library name missing from $manifest"; cat "$manifest"; exit 1; }
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          unsigned=$(find build-android -name '*-unsigned.apk' | head -1)
          tools="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira.jks"
            password="$ANDROID_KEYSTORE_PASSWORD"
          else
            # No release key configured: sign with a throwaway key. Such builds install fine, but
            # updating to a build signed with a different key requires uninstalling first.
            password=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/mira.jks" -storepass "$password" -keypass "$password" \
              -alias mira -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mira development build" >/dev/null
          fi
          mkdir -p dist
          version=$(sed -n 's/set(APP_VERSION "\(.*\)")/\1/p' cmake/AppIdentity.cmake)
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/mira.jks" --ks-pass "pass:$password" --ks-key-alias mira \
            --out "dist/mira-${version}-android-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "dist/mira-${version}-android-arm64.apk" | grep -i "SHA-1"
          rm -f "$RUNNER_TEMP/mira.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: mira-android
          path: dist/*.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rpm, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=$(find artifacts -type f \( -name '*.rpm' -o -name '*.apk' -o -name '*.exe' -o -name '*.dmg' -o -name 'qt-everywhere-src-*.tar.xz' \))
          notes="Downloads: .exe for Windows, .dmg for macOS, .rpm for Fedora, .apk for Android (arm64). Setup steps are in the README.

          The installers include Qt (LGPL-3.0); its corresponding source is attached as qt-everywhere-src-*.tar.xz."
          gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --title "Mira $version" --notes "$notes"
